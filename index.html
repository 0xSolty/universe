<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type a word. Get a universe.</title>
<meta name="description" content="Every word holds its own universe. Type one and watch it being born.">
<style>
@font-face{font-family:"M";font-weight:400;src:url("fonts/ibm-plex-mono-latin-400-normal.woff2")}
@font-face{font-family:"M";font-weight:500;src:url("fonts/ibm-plex-mono-latin-500-normal.woff2")}
@font-face{font-family:"M";font-weight:600;src:url("fonts/ibm-plex-mono-latin-600-normal.woff2")}
:root{--tx:#f4efff;--dim:#9a93b8;--acc:#ffb36b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--tx);font-family:M,ui-monospace,monospace}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;bottom:7vh;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:5;padding:0 16px}
#form{display:flex;gap:8px;width:min(560px,100%);background:rgba(10,8,20,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 6px 6px 20px;backdrop-filter:blur(10px)}
#word{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font:500 18px M;letter-spacing:.5px}
#word::placeholder{color:var(--dim)}
#go{border:0;border-radius:999px;background:var(--tx);color:#0b0816;font:600 15px M;padding:12px 20px;cursor:pointer}
#hint{font:400 13px M;color:var(--dim);letter-spacing:1px;text-align:center}
#title{position:fixed;top:7vh;left:0;right:0;text-align:center;z-index:5;pointer-events:none;opacity:0;transition:opacity .8s}
#title .k{font:400 13px M;letter-spacing:5px;color:var(--dim);text-transform:uppercase}
#title .w{font:600 clamp(30px,6vw,64px) M;letter-spacing:2px;margin-top:6px;text-shadow:0 0 30px rgba(255,255,255,.35)}
#title .s{font:400 13px M;color:var(--dim);margin-top:10px;letter-spacing:1px}
#actions{display:flex;gap:8px;opacity:0;transition:opacity .6s}
#actions button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:var(--tx);border-radius:999px;font:500 13px M;padding:8px 14px;cursor:pointer}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.film #ui,.film #actions{display:none}
#filmcap{position:fixed;left:0;right:0;bottom:120px;display:none;justify-content:center;z-index:6}
.film #filmcap{display:flex}
#filmbox{display:flex;align-items:center;gap:10px;background:rgba(10,8,20,.6);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:16px 30px;font:500 30px M;min-width:560px}
#filmbox i{display:inline-block;width:14px;height:34px;background:var(--acc);margin-left:2px}
#mark{position:fixed;right:24px;bottom:18px;font:400 14px M;color:rgba(255,255,255,.28);z-index:6;display:none}
.film #mark{display:block}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/jsm/"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="flash"></div>
<div id="title"><div class="k">the universe of</div><div class="w" id="tw"></div><div class="s" id="ts"></div></div>
<div id="ui">
 <form id="form" autocomplete="off"><input id="word" maxlength="40" placeholder="type any word…" aria-label="word"><button id="go" type="submit">create</button></form>
 <div id="actions"><button id="save" type="button">save image</button><button id="copy" type="button">copy link</button><button id="snd" type="button">sound: on</button></div>
 <div id="hint">every word holds its own universe · same word, same universe</div>
</div>
<div id="filmcap"><div id="filmbox"><span id="filmtxt"></span><i id="filmcur"></i></div></div>
<div id="mark">@0xSolty</div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const FILM=new URLSearchParams(location.search).has('film');
if(FILM)document.body.classList.add('film');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,u)=>a+(b-a)*u,eo=u=>{u=clamp(u,0,1);return 1-Math.pow(1-u,3)},eio=u=>{u=clamp(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
// ---------- seeded random ----------
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0)*4294967296+(h1>>>0)}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ---------- renderer ----------
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.9;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(45,1,0.1,4000);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(512,512),0.75,0.5,0.55);composer.addPass(bloom);composer.addPass(new OutputPass());
let controls=null;if(!FILM){controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=0.35;controls.minDistance=8;controls.maxDistance=160;controls.enablePan=false}
function resize(){const w=FILM?1080:innerWidth,h=FILM?1350:innerHeight;renderer.setPixelRatio(FILM?1:Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();bloom.resolution.set(w/2,h/2)}
resize();addEventListener('resize',resize);
// ---------- textures ----------
function noise2(rnd){const G=64,g=[];for(let i=0;i<G*G;i++)g.push(rnd());const s=(x,y)=>g[((y%G+G)%G)*G+((x%G+G)%G)];return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(s(xi,yi),s(xi+1,yi),u),lerp(s(xi,yi+1),s(xi+1,yi+1),u),v)}}
function fbm(n,x,y,o=5){let a=0,f=1,amp=0.5;for(let i=0;i<o;i++){a+=n(x*f,y*f)*amp;f*=2;amp*=0.5}return a}
function hsl(h,s,l){return new THREE.Color().setHSL(((h%1)+1)%1,clamp(s,0,1),clamp(l,0,1))}
function planetTex(rnd,type,c1,c2,c3){const W=512,H=256;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');const img=g.createImageData(W,H);const n=noise2(rnd);const sc=2+rnd()*4;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v;const nx=x/W*sc*2,ny=y/H*sc;
  if(type==='gas'){v=fbm(n,nx*0.3,ny*3+fbm(n,nx,ny)*1.5,4)}else{v=fbm(n,nx,ny,6)}
  let col;if(type==='ocean'){col=v>0.55?c2.clone().lerp(c3,(v-0.55)*3):c1.clone().lerp(c1.clone().multiplyScalar(0.6),1-v)}
  else if(type==='lava'){col=v>0.6?c3.clone().lerp(new THREE.Color(1,0.95,0.6),(v-0.6)*2.5):c1.clone().multiplyScalar(0.25+v*0.5)}
  else if(type==='ice'){col=c1.clone().lerp(new THREE.Color(1,1,1),v*0.9)}
  else if(type==='gas'){col=c1.clone().lerp(c2,clamp(v*1.6-0.3,0,1)).lerp(c3,clamp((v-0.6)*2,0,1)*0.6)}
  else{col=c1.clone().lerp(c2,v);const cr=n(nx*4+50,ny*4+50);if(cr>0.78)col.multiplyScalar(0.6)}
  const i=(y*W+x)*4;img.data[i]=col.r*255;img.data[i+1]=col.g*255;img.data[i+2]=col.b*255;img.data[i+3]=255}
 g.putImageData(img,0,0);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t}
function glowTex(c,soft=0.5){const cv=document.createElement('canvas');cv.width=cv.height=256;const g=cv.getContext('2d');const gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.12,`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.9)`);gr.addColorStop(soft,`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.18)`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);const t=new THREE.CanvasTexture(cv);return t}
function nebTex(rnd,c){const S=256;const cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');const img=g.createImageData(S,S);const n=noise2(rnd);for(let y=0;y<S;y++)for(let x=0;x<S;x++){const dx=x/S-0.5,dy=y/S-0.5,d=Math.sqrt(dx*dx+dy*dy)*2;const v=fbm(n,x/S*4,y/S*4,5);const a=clamp((v-0.35)*2,0,1)*clamp(1-d,0,1)**1.5;const i=(y*S+x)*4;img.data[i]=c.r*255;img.data[i+1]=c.g*255;img.data[i+2]=c.b*255;img.data[i+3]=a*255}g.putImageData(img,0,0);return new THREE.CanvasTexture(cv)}
function ringTex(rnd,c){const cv=document.createElement('canvas');cv.width=512;cv.height=8;const g=cv.getContext('2d');for(let x=0;x<512;x++){const a=(0.3+0.7*Math.abs(Math.sin(x*0.05+rnd()*0.4)))*(x>20&&x<500?1:0)*(rnd()>0.08?1:0.2);g.fillStyle=`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},${a*0.8})`;g.fillRect(x,0,1,8)}return new THREE.CanvasTexture(cv)}
// ---------- creature ----------
function makeCreature(rnd,color){const g=new THREE.Group();const w=5+Math.floor(rnd()*3),h=5+Math.floor(rnd()*3);const eyes=1+Math.floor(rnd()*3);const vs=0.11;
 const body=new THREE.MeshStandardMaterial({color,roughness:0.5,emissive:color,emissiveIntensity:0.07});const dark=new THREE.MeshStandardMaterial({color:0x0b0816});const white=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:0.25});
 const box=new THREE.BoxGeometry(vs,vs,vs);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const edge=(y===h-1&&(x===0||x===w-1));if(edge)continue;for(let z=0;z<3;z++){const m=new THREE.Mesh(box,body);m.position.set((x-(w-1)/2)*vs,y*vs+vs/2+vs,(z-1)*vs);g.add(m)}}
 // legs
 [-1,1].forEach(s=>{const m=new THREE.Mesh(box,body);m.position.set(s*(w/2-1)*vs,vs/2,0);g.add(m)});
 // eyes
 const ey=(h-2)*vs+vs;for(let e=0;e<eyes;e++){const ex=(eyes===1?0:(e/(eyes-1)-0.5)*(w-2.5)*vs);const m=new THREE.Mesh(box,white);m.scale.set(1,1.4,0.5);m.position.set(ex,ey,1.6*vs);g.add(m);const p=new THREE.Mesh(box,dark);p.scale.set(0.55,0.75,0.5);p.position.set(ex,ey,1.85*vs);g.add(p)}
 // antenna or ears
 const kind=rnd();if(kind<0.4){const a=new THREE.Mesh(box,body);a.scale.set(0.4,3,0.4);a.position.set(0,(h+1)*vs+vs*0.8,0);g.add(a);const b=new THREE.Mesh(box,white);b.position.set(0,(h+3)*vs,0);g.add(b)}else if(kind<0.8){[-1,1].forEach(s=>{const a=new THREE.Mesh(box,body);a.scale.set(0.8,1.6,0.8);a.position.set(s*(w/2-0.6)*vs,(h+1)*vs+vs*0.2,0);g.add(a)})}
 // waving arm
 const arm=new THREE.Group();const am=new THREE.Mesh(box,body);am.scale.set(0.8,2.2,0.8);am.position.y=vs*1.1;arm.add(am);arm.position.set((w/2)*vs+vs*0.4,h*0.55*vs+vs,0);g.add(arm);g.userData.arm=arm;
 return g}
// ---------- universe ----------
let U=null;
function disposeU(){if(!U)return;scene.remove(U.root);U.root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}})}
const TYPES=['rocky','gas','ocean','ice','lava'];
function build(word){disposeU();const seed=hash(word.trim().toLowerCase()||'void');const rnd=mulberry(seed%4294967296);
 const root=new THREE.Group();scene.add(root);const H0=rnd(),H1=(H0+0.15+rnd()*0.5)%1,H2=(H0+0.5+rnd()*0.2)%1;
 // background stars
 {const N=2500,pos=new Float32Array(N*3),col=new Float32Array(N*3);for(let i=0;i<N;i++){const u=rnd()*2-1,th=rnd()*Math.PI*2,r=900+rnd()*300;const s=Math.sqrt(1-u*u);pos.set([Math.cos(th)*s*r,u*r,Math.sin(th)*s*r],i*3);const c=hsl(rnd()<0.5?H0:H2,0.3,0.75+rnd()*0.25);col.set([c.r,c.g,c.b],i*3)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));root.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,vertexColors:true,sizeAttenuation:false,transparent:true,opacity:0.9})))}
 // galaxy backdrop
 const arms=2+Math.floor(rnd()*4),twist=1.5+rnd()*3.5,R=220+rnd()*120;const gal=new THREE.Group();
 {const N=16000,pos=new Float32Array(N*3),col=new Float32Array(N*3);const cIn=hsl(H0,0.6,0.75),cOut=hsl(H1,0.85,0.55);for(let i=0;i<N;i++){const r=Math.pow(rnd(),0.55)*R;const a=Math.floor(rnd()*arms)/arms*Math.PI*2+r/R*twist*Math.PI+(rnd()-0.5)*(0.6-r/R*0.35);const sp=(rnd()-0.5)*(1-r/R)*30;pos.set([Math.cos(a)*r+(rnd()-0.5)*8,sp,Math.sin(a)*r+(rnd()-0.5)*8],i*3);const c=cIn.clone().lerp(cOut,r/R);if(rnd()<0.08)c.set(0xffffff);col.set([c.r,c.g,c.b],i*3)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));const m=new THREE.PointsMaterial({size:1.6,vertexColors:true,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false});gal.add(new THREE.Points(g,m));gal.userData.mat=m}
 const core=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(hsl(H0,0.7,0.7),0.45),blending:THREE.AdditiveBlending,depthWrite:false}));core.scale.set(110,110,1);gal.add(core);
 gal.position.set(-60+rnd()*120,-120-rnd()*60,-420);gal.rotation.set(-0.9-rnd()*0.5,rnd()*6,0.2);root.add(gal);
 // nebulae
 const nebs=[];for(let i=0;i<5;i++){const c=hsl([H0,H1,H2][i%3],0.8,0.5);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:nebTex(rnd,c),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.55}));const sc=180+rnd()*240;s.scale.set(sc,sc,1);s.position.set((rnd()-0.5)*500,(rnd()-0.5)*260,-260-rnd()*300);root.add(s);nebs.push(s)}
 // star (sun)
 const sunC=hsl(rnd()<0.6?0.08+rnd()*0.06:H0,0.9,0.62);const sunR=2.2+rnd()*1.6;const sun=new THREE.Mesh(new THREE.SphereGeometry(sunR,48,32),new THREE.MeshBasicMaterial({color:sunC.clone().multiplyScalar(1.15)}));root.add(sun);
 const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(sunC,0.35),blending:THREE.AdditiveBlending,depthWrite:false}));sunGlow.scale.set(sunR*4.5,sunR*4.5,1);root.add(sunGlow);
 const light=new THREE.PointLight(sunC.clone().lerp(new THREE.Color(1,1,1),0.5),900,0,1.6);root.add(light);root.add(new THREE.AmbientLight(0x221a33,0.6));
 // planets
 const nP=3+Math.floor(rnd()*4);const planets=[];let orbit=sunR+4;let home=-1;
 for(let i=0;i<nP;i++){orbit+=3+rnd()*4.5;const type=TYPES[Math.floor(rnd()*TYPES.length)];const pr=0.6+rnd()*(type==='gas'?1.8:1.0);const c1=hsl(rnd(),0.45+rnd()*0.4,0.35+rnd()*0.25),c2=hsl(rnd(),0.5,0.55),c3=hsl(rnd(),0.6,0.7);
  const mat=new THREE.MeshStandardMaterial({map:planetTex(rnd,type,c1,c2,c3),roughness:0.85,metalness:0.0,emissive:type==='lava'?0xff4a10:0x000000,emissiveIntensity:type==='lava'?0.35:0});
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(pr,48,32),mat);const pg=new THREE.Group();pg.add(mesh);
  if(type==='gas'||rnd()<0.2){const ring=new THREE.Mesh(new THREE.RingGeometry(pr*1.4,pr*2.3,96,1),new THREE.MeshBasicMaterial({map:ringTex(rnd,c3),side:THREE.DoubleSide,transparent:true,depthWrite:false}));const uv=ring.geometry.attributes.uv,p=ring.geometry.attributes.position;for(let k=0;k<uv.count;k++){const v=new THREE.Vector3().fromBufferAttribute(p,k);uv.setXY(k,(v.length()-pr*1.4)/(pr*0.9),0.5)}ring.rotation.x=-Math.PI/2+0.4*(rnd()-0.5);pg.add(ring)}
  const moons=[];const nm=Math.floor(rnd()*3.2);for(let k=0;k<nm;k++){const mm=new THREE.Mesh(new THREE.SphereGeometry(0.12+rnd()*0.22,24,16),new THREE.MeshStandardMaterial({color:hsl(rnd(),0.15,0.6),roughness:1}));moons.push({m:mm,r:pr*1.8+0.6+k*0.6,sp:0.6+rnd()*1.2,ph:rnd()*6.28});pg.add(mm)}
  root.add(pg);planets.push({g:pg,mesh,r:pr,orbit,ang:rnd()*Math.PI*2,sp:(0.25+rnd()*0.4)/Math.sqrt(orbit),tilt:(rnd()-0.5)*0.25,moons,type});if(home<0&&(type==='rocky'||type==='ocean'||type==='ice'))home=i}
 if(home<0)home=0;
 // orbit lines
 planets.forEach(p=>{const pts=[];for(let k=0;k<=128;k++){const a=k/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*p.orbit,Math.sin(a)*p.orbit*p.tilt,Math.sin(a)*p.orbit))}const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.07}));root.add(l)});
 // creature on home planet
 const cc=hsl(rnd(),0.85,0.6);const crit=makeCreature(rnd,cc);const hp=planets[home];const cs=hp.r*0.55;crit.scale.setScalar(cs);crit.position.set(0,hp.r*0.98,0);hp.g.add(crit);
 // stats
 const moonsN=planets.reduce((a,p)=>a+p.moons.length,0);const age=(1+rnd()*13).toFixed(1);
 const stats=`${nP} planets · ${moonsN} moons · 1 lifeform · ${age}B years old`;
 // bang particles
 const BN=3000,bpos=new Float32Array(BN*3),bdir=[];for(let i=0;i<BN;i++){const u=rnd()*2-1,th=rnd()*Math.PI*2,s=Math.sqrt(1-u*u);bdir.push([Math.cos(th)*s,u,Math.sin(th)*s,0.4+rnd()])}const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(bpos,3));const bm=new THREE.PointsMaterial({color:hsl(H0,0.6,0.85),size:0.18,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});const bang=new THREE.Points(bg,bm);root.add(bang);
 U={word,seed,root,gal,nebs,sun,sunGlow,sunR,light,planets,home,crit,stats,bang,bdir,bpos,bm,H0,H1,H2,camSeed:rnd()};
 // music params
 U.music={scale:[[0,2,4,7,9],[0,3,5,7,10],[0,2,3,7,8],[0,4,5,7,11]][Math.floor(rnd()*4)],root:45+Math.floor(rnd()*12),bpm:70+Math.floor(rnd()*40),seed:Math.floor(rnd()*1e9)};
 return U}
// ---------- animation state ----------
function animate(u,t){// t = seconds since birth
 const b=eo(t/1.6);
 u.bpos.forEach((_,i)=>{});for(let i=0;i<u.bdir.length;i++){const d=u.bdir[i];const r=t*24*d[3];u.bpos[i*3]=d[0]*r;u.bpos[i*3+1]=d[1]*r;u.bpos[i*3+2]=d[2]*r}u.bang.geometry.attributes.position.needsUpdate=true;u.bm.opacity=clamp(1-t/1.2,0,1);
 u.sun.scale.setScalar(Math.max(0.001,eo(t/0.8)));u.sunGlow.scale.setScalar(u.sunR*4.5*(0.6+0.4*eo(t/0.8))*(1+Math.sin(t*2)*0.03));
 u.gal.userData.mat.opacity=0.6*eo((t-0.3)/1.8);u.gal.rotation.y+=0;u.gal.children[0].rotation.y=t*0.02;
 u.nebs.forEach((n,i)=>{n.material.opacity=0.3*eo((t-0.5-i*0.1)/1.5)});
 u.planets.forEach((p,i)=>{const pop=eo((t-0.6-i*0.15)/0.7);const a=p.ang+t*p.sp*1.2;p.g.position.set(Math.cos(a)*p.orbit*lerp(0.2,1,pop),Math.sin(a)*p.orbit*p.tilt,Math.sin(a)*p.orbit*lerp(0.2,1,pop));p.g.scale.setScalar(Math.max(0.001,pop));p.mesh.rotation.y=t*0.3;
  p.moons.forEach(m=>{const ma=m.ph+t*m.sp;m.m.position.set(Math.cos(ma)*m.r,Math.sin(ma)*m.r*0.3,Math.sin(ma)*m.r)})});
 const hp=u.planets[u.home];u.crit.rotation.y=-hp.mesh.rotation.y*0+Math.sin(t*0.5)*0.4;u.crit.userData.arm.rotation.z=-0.6-Math.abs(Math.sin(t*6))*1.2;u.crit.position.y=hp.r*0.98+Math.abs(Math.sin(t*3))*0.02*hp.r}
function homeWorldPos(u){const v=new THREE.Vector3();u.planets[u.home].g.getWorldPosition(v);return v}
// ---------- site mode ----------
const $=id=>document.getElementById(id);
let born=0,audio=null,soundOn=true;
function showTitle(u){$('tw').textContent=u.word;$('ts').textContent=u.stats;$('title').style.opacity=1;$('actions').style.opacity=1}
function flash(){const f=$('flash');f.style.transition='none';f.style.opacity=0.9;requestAnimationFrame(()=>{f.style.transition='opacity 1.2s';f.style.opacity=0})}
function create(word){word=(word||'').trim().slice(0,40);if(!word)return;build(word);born=performance.now();flash();showTitle(U);if(controls){camera.position.set(0,6,14);controls.target.set(0,0,0)}history.replaceState(null,'','?u='+encodeURIComponent(word));playMusic(U)}
function playMusic(u){if(!soundOn)return;try{audio&&audio.close();audio=new (window.AudioContext||window.webkitAudioContext)();const ctx=audio;const r=mulberry(u.music.seed);const master=ctx.createGain();master.gain.value=0.18;master.connect(ctx.destination);
 const dl=ctx.createDelay(1);dl.delayTime.value=60/u.music.bpm*0.75;const fb=ctx.createGain();fb.gain.value=0.35;dl.connect(fb);fb.connect(dl);dl.connect(master);
 const note=(n,t0,d,g,type)=>{const o=ctx.createOscillator(),e=ctx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(n-69)/12);e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(g,t0+0.02);e.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(e);e.connect(master);e.connect(dl);o.start(t0);o.stop(t0+d+0.05)};
 const now=ctx.currentTime+0.05;const step=60/u.music.bpm/2;const sc=u.music.scale;
 [0,7,12].forEach(k=>note(u.music.root-12+k,now,6,0.12,'sine'));
 for(let i=0;i<48;i++){if(r()<0.7){const deg=sc[Math.floor(r()*sc.length)];const oct=12*(1+Math.floor(r()*2));note(u.music.root+deg+oct,now+0.6+i*step,1.4,0.08,'triangle')}}
}catch(e){}}
$('form').addEventListener('submit',e=>{e.preventDefault();create($('word').value)});
$('save').addEventListener('click',()=>{composer.render();const a=document.createElement('a');a.download='universe-of-'+(U?U.word:'x').replace(/[^a-z0-9]+/gi,'-')+'.png';a.href=canvas.toDataURL('image/png');a.click()});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='copied ✓';setTimeout(()=>$('copy').textContent='copy link',1500)}catch(e){}});
$('snd').addEventListener('click',()=>{soundOn=!soundOn;$('snd').textContent='sound: '+(soundOn?'on':'off');if(!soundOn&&audio)audio.close()});
if(!FILM){const q=new URLSearchParams(location.search).get('u');build(q||'hello');showTitle(U);born=performance.now()-4000;camera.position.set(0,7,18);
 (function loop(){requestAnimationFrame(loop);const t=(performance.now()-born)/1000;animate(U,t);controls.update();composer.render()})()}
// ---------- film mode ----------
// shots: [word, start, dur]
const SHOTS=[["elon",0,4.6],["pizza",4.6,4.2],["my ex",8.8,4.4],["anthropic",13.2,4.4],["monday",17.6,3.8]];const FILM_END=25.5;
let cur=null;
window.__frame=function(T){const s=SHOTS.find(s=>T>=s[1]&&T<s[1]+s[2]);
 if(s){if(!cur||cur.word!==s[0])build(s[0]),cur=U;const t=T-s[1],d=s[2];animate(U,t+0.05);
  // typing caption at start of each shot (types during first 0.55s, then holds)
  const txt=s[0].slice(0,Math.floor((t+0.05)*18));document.getElementById('filmtxt').textContent=txt;document.getElementById('filmcur').style.opacity=Math.floor(T*3)%2?1:0;
  document.getElementById('filmcap').style.opacity=t<1.4?1:Math.max(0,1-(t-1.4)/0.4);
  $('tw').textContent=U.word;$('ts').textContent=U.stats;$('title').style.transition='none';$('title').style.opacity=t>0.9?Math.min(1,(t-0.9)/0.4):0;
  // camera: from inside bang -> pull back wide -> push toward creature
  const hw=homeWorldPos(U);const r0=U.camSeed*6.28;const wide=new THREE.Vector3(Math.cos(r0+t*0.1)*46,16+Math.sin(t*0.3)*2,Math.sin(r0+t*0.1)*46);
  const near=hw.clone().add(new THREE.Vector3(0,U.planets[U.home].r*0.9,U.planets[U.home].r*3.2+1.2));
  let pos,look;if(t<1.2){const u=eo(t/1.2);pos=new THREE.Vector3(0,1,3).lerp(wide,u);look=new THREE.Vector3(0,0,0)}else if(t<d-1.4){pos=wide;look=new THREE.Vector3(0,0,0)}else{const u=eio((t-(d-1.4))/1.2);pos=wide.clone().lerp(near,u);look=new THREE.Vector3(0,0,0).lerp(hw.clone().add(new THREE.Vector3(0,U.planets[U.home].r*0.9,0)),u)}
  camera.position.copy(pos);camera.lookAt(look);U.crit.lookAt(camera.position);
  // white flash at birth
  $('flash').style.transition='none';$('flash').style.opacity=t<0.18?0.7*(1-t/0.18):0}
 else{// end card
  const t=T-(SHOTS[SHOTS.length-1][1]+SHOTS[SHOTS.length-1][2]);if(!cur||cur.word!=='?'){build('?');cur=U}animate(U,t+3);camera.position.set(Math.cos(t*0.12)*46,16,Math.sin(t*0.12)*46);camera.lookAt(0,0,0);
  $('title').style.opacity=0;document.getElementById('filmcap').style.opacity=1;document.getElementById('filmtxt').textContent='what\'s yours?';document.getElementById('filmcur').style.opacity=Math.floor(T*2.5)%2?1:0;$('flash').style.opacity=0}
 composer.render()};
window.__ready=true;
